name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  isolation:
    # Tenant isolation test (ARCHITECTURE §7.4). Runs against a hermetic local
    # Supabase stack, so it needs no secrets. A failure here blocks the workflow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase (applies migrations)
        run: supabase start

      - name: Run isolation test as an anon-key authenticated user
        run: |
          # Map `supabase status` output (API_URL, ANON_KEY, ...) to the names the
          # test reads. psql is preinstalled on ubuntu-latest for catalog checks.
          eval "$(supabase status -o env | sed 's/^/export /')"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export SUPABASE_DB_URL="$DB_URL"
          npm run test:isolation

      - name: Stop Supabase
        if: always()
        run: supabase stop
