name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  tests:
    # Tenant isolation (ARCHITECTURE §7.4) + critical-flow smoke (CONVENTIONS §13).
    # Both run against a hermetic local Supabase stack, so they need no secrets.
    # A failure here blocks the workflow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase (applies migrations)
        run: supabase start

      - name: Export Supabase env for the tests
        run: |
          # Map `supabase status` output (API_URL, ANON_KEY, ...) to the names the
          # tests read, and share them with later steps. psql is preinstalled on
          # ubuntu-latest for the isolation test's catalog checks.
          eval "$(supabase status -o env | sed 's/^/export /')"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_DB_URL=$DB_URL"
          } >> "$GITHUB_ENV"

      - name: Isolation test (anon-key authenticated user)
        run: npm run test:isolation

      - name: Smoke test (sign in, add/read/archive athlete)
        run: npm run test:smoke

      - name: Stop Supabase
        if: always()
        run: supabase stop
